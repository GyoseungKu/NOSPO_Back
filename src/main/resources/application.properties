spring.application.name=nospo-backend

nospo.auth.kakao.client-id=${KAKAO_CLIENT_ID:}
nospo.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
nospo.auth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:https://localhost:8080/api/v1/auth/kakao/callback}
nospo.auth.kakao.frontend-callback=${KAKAO_FRONTEND_CALLBACK:https://localhost:3000/auth/kakao/callback}
nospo.auth.kakao.return-paths=${KAKAO_RETURN_PATHS:/,/shelf}
nospo.auth.kakao.cleanup-enabled=${KAKAO_CLEANUP_ENABLED:true}
# Do not log outbound HTTP credentials or inbound OAuth query/body details.
logging.level.sun.net.www.protocol.http.HttpURLConnection=OFF
logging.level.sun.net.www.protocol.https.HttpsClient=OFF
spring.mvc.log-request-details=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nospo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:nospo}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

nospo.auth.encryption-key=${AUTH_ENCRYPTION_KEY:}
nospo.auth.hmac-key=${AUTH_HMAC_KEY:}
nospo.auth.jwt-key=${AUTH_JWT_KEY:}
nospo.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
nospo.auth.email-confirm-url=${AUTH_EMAIL_CONFIRM_URL:http://localhost:3000/auth/email-confirm}
nospo.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
nospo.mail.from=${MAIL_FROM:no-reply@localhost}
nospo.mail.worker-enabled=${MAIL_WORKER_ENABLED:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
