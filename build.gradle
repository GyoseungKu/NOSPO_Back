plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.nospo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
    if (project.hasProperty('skipMysql')) { exclude '**/MySqlEmailSignupTests.class' }
}

configure(subprojects.findAll { it.buildFile.exists() }) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.named('jar') { archiveBaseName = project.path.substring(1).replace(':', '-') }
    dependencyManagement { imports { mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += '-parameters' }
}
dependencies {
    testRuntimeOnly 'com.h2database:h2:2.5.250'
    testImplementation 'org.eclipse.angus:angus-mail'
    implementation project(':support')
    implementation project(':member:contract')
    implementation project(':member:application')
    implementation project(':member:adapter-web')
    implementation project(':member:adapter-integration')
    implementation project(':member:domain')
    implementation project(':member:adapter-persistence')
    implementation project(':terms:contract')
    implementation project(':terms:application')
    implementation project(':terms:adapter-persistence')
    implementation project(':terms:adapter-web')
    implementation project(':credit:contract')
    implementation project(':credit:application')
    implementation project(':credit:adapter-persistence')
    implementation project(':credit:adapter-web')
    implementation project(':ai:application')
    implementation project(':ai:adapter-persistence')
    implementation project(':ai:adapter-web')
    implementation project(':ai:adapter-integration')
    implementation project(':ai:adapter-worker')
    implementation project(':identity:contract')
    implementation project(':identity:domain')
    implementation project(':identity:application')
    implementation project(':identity:adapter-persistence')
    implementation project(':identity:adapter-integration')
    implementation project(':identity:adapter-worker')
    implementation project(':identity:adapter-web')
    implementation project(':account-lifecycle:application')
    implementation project(':account-lifecycle:adapter-persistence')
    implementation project(':account-lifecycle:adapter-web')
    implementation project(':account-lifecycle:adapter-worker')
    implementation project(':notice:adapter-persistence')
    implementation project(':notice:adapter-web')
    implementation project(':book:application')
    implementation project(':book:adapter-persistence')
    implementation project(':book:adapter-web')
    implementation project(':book:adapter-integration')
    implementation project(':wiki:adapter-persistence')
    implementation project(':wiki:adapter-web')
    implementation project(':wiki:application')
    testImplementation project(':notice:application')
}

// These adapters are compiled when their owning feature modules are present in the combined checkout.
if (findProject(':book:contract') != null) {
    sourceSets.main.java.srcDir 'src/integrationBook/java'
    sourceSets.main.resources.srcDir 'src/integrationBook/resources'
    dependencies { implementation project(':book:contract') }
}
if (findProject(':ai:application') != null) {
    sourceSets.main.java.srcDir 'src/integrationAi/java'
}
if (findProject(':book:contract') != null && findProject(':ai:application') != null) {
    sourceSets.test.java.srcDir 'src/integrationWikiTest/java'
}
