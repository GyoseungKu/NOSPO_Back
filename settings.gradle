rootProject.name = 'nospo-backend'

include ':member:application'
project(':member:application').projectDir = file('modules/member/application')

['member', 'terms', 'credit', 'identity', 'account-lifecycle'].each { name ->
    include ":${name}"
    project(":${name}").projectDir = file("modules/${name}")
}

